components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 资源 UUID (部分接口为插件名)
    PathChatAreaID:
      name: chatAreaID
      in: path
      required: true
      schema:
        type: string
      description: ChatArea UUID
    PathPluginID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 插件目录名（非 UUID）

  schemas:
    # ---------- 通用 ----------
    FinalResponse:
      type: object
      properties:
        status:
          type: integer
          format: uint
          description: 0=成功，非 0=错误码
          example: 0
        info:
          type: string
          description: 状态描述
          example: OK
        data:
          description: 业务数据，可为任意类型或 null
      required: [status, info]

    ErrorDetail:
      type: object
      properties:
        error_detail:
          type: string

    ToggleReq:
      type: object
      properties:
        is_active:
          type: boolean
      required: [is_active]

    # ---------- Auth ----------
    LoginReq:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    ChangePasswordReq:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required: [old_password, new_password]

    TokenResp:
      type: object
      properties:
        token:
          type: string
          description: JWT token
      required: [token]

    # ---------- Adapter ----------
    AdapterStatus:
      type: object
      properties:
        running:
          type: boolean
          description: 适配器是否在运行
        listen_addr:
          type: string
          description: 监听地址 host:port
        self_id:
          type: integer
          format: int64
          description: 机器人 QQ 号
        conn_count:
          type: integer
          description: 当前 WebSocket 连接数
        conn_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 已连接客户端 QQ 号列表
        conns:
          type: array
          items:
            $ref: '#/components/schemas/AdapterConnDetail'
          description: 已连接客户端详情

    UpdateAdapterConfigReq:
      type: object
      properties:
        addr:
          type: string
          description: 监听地址
        port:
          type: integer
          description: 监听端口
        token:
          type: string
          description: OneBot access token
        admin_qq_numbers:
          type: array
          items:
            type: string
          description: 管理员 QQ 号列表
        enabled:
          type: boolean
          description: 是否启用
      required: [addr, port, token, admin_qq_numbers, enabled]

    # ---------- Provider ----------
    ProviderResp:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        name:
          type: string
        type:
          $ref: '#/components/schemas/ModelType'
        endpoint:
          type: string
        token:
          type: string
        model:
          type: string
        temperature:
          type: number
          format: float
        is_active:
          type: boolean
        enable_thinking:
          type: boolean
          description: 模型思考开关（旧字段，兼容）
        api_mode:
          type: string
          description: 协议模式：chat_completions/anthropic_messages/openai_responses/gemini_native
        thinking_effort:
          type: string
          description: 思考强度 off/low/medium/high
        thinking_budget:
          type: integer
        max_tokens:
          type: integer
        top_p:
          type: number
          format: float
        top_k:
          type: integer
        frequency_penalty:
          type: number
          format: float
        presence_penalty:
          type: number
          format: float
        repetition_penalty:
          type: number
          format: float
        provider_key:
          type: string
        auth_header:
          type: string
        url_mode:
          type: string

    AddProviderReq:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ModelType'
        endpoint:
          type: string
        token:
          type: string
        model:
          type: string
        temperature:
          type: number
          format: float
          default: 0.7
        isActive:
          type: boolean
        enable_thinking:
          type: boolean
        api_mode:
          type: string
        thinking_effort:
          type: string
        thinking_budget:
          type: integer
        max_tokens:
          type: integer
