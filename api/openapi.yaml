openapi: "3.0.3"
info:
  title: JuanNiang-Neo API
  description: |
    JuanNiang-Neo Web 管理面板 API。

    ## 通用响应格式

    所有接口都返回 `FinalResponse`:
    ```json
    {"status": 0, "info": "OK", "data": <任意类型或 null>}
    ```

    - `status`: 0 表示成功，非 0 为错误码
    - `info`: 状态描述
    - `data`: 业务数据，失败时可为 null 或 `{"error_detail": "..."}`

    ## 认证

    除 `POST /login` 和 `GET /health` 外所有接口都需要 `Authorization: Bearer <token>` header。
    通过 `POST /login` 获取 token，默认账号 `admin / Admin123`。

    ## 错误码

    | Code | 说明 |
    |------|------|
    | 0 | 成功 |
    | 40001 | 参数格式错误 |
    | 40002 | 用户名或密码错误 |
    | 40003 | token 生成失败 |
    | 40004 | 用户不存在 |
    | 40005 | 原密码错误 |
    | 40006 | 密码更新失败 |
    | 40007 | 无效的 QQ 号 |
    | 40008 | adapter 未初始化 |
    | 40009 | provider 不存在 |
    | 40010 | MCP 服务器不存在 |
    | 40011 | Session 不存在 |
    | 40012 | 缺少上传文件 |
    | 40013 | 临时文件创建失败 |
    | 40014 | 文件写入失败 |
    | 40015 | 无效的 ZIP 文件 |
    | 40016 | 无效的 ACL ID |
    | 40017 | onebot11 适配器配置更新失败 |
    | 40018 | Skill 不存在 |
    | 40019 | Prompt 不存在 |
    | 40020 | Tool 不存在 |
    | 40021 | Plugin 不存在 |
    | 40022 | 插件加载失败 |
    | 40023 | ChatArea 不存在 |
    | 40024 | Memory 配置不存在 |
    | 40025 | adapter 配置不存在 |
    | 40026 | T2I 配置不存在 |
    | 40027 | Sandbox 配置不存在 |
    | 50000 | 服务器内部错误 |

    ## ACL 规则语义

    - 无规则 = 允许所有（默认）
    - `deny` + `all` = 拒绝所有用户
    - `deny` + `list` = 拒绝指定用户
    - `allow` + `all` = 允许所有用户
    - `allow` + `list` = 仅允许指定用户（白名单）

    检查优先级: `deny` > `allow`；存在 `allow` 规则时未命中即拒绝。
    Admins 列表中的用户绕过所有 ACL 检查。
  version: "1.0.0"
  contact:
    name: JuanNiang-Neo
servers:
  - url: http://localhost:8090/api/v1
    description: 本地开发
tags:
  - name: Auth
    description: 认证
  - name: Adapter
    description: OneBot11 适配器
  - name: Provider
    description: LLM Provider
  - name: MCP
    description: MCP 服务器
  - name: Memory
    description: 记忆配置
  - name: Prompt
    description: Prompt 模板
  - name: Session
    description: 会话
  - name: Skill
    description: Skill 配置
  - name: Tool
    description: Tool 配置
  - name: Plugin
    description: Lua 插件
  - name: ACL
    description: 访问控制
  - name: ChatRecord
    description: 聊天记录
  - name: ChatArea
    description: 聊天区域
  - name: Overview
    description: 全局概览
  - name: T2I
    description: Text-to-Image
  - name: Sandbox
    description: 代码沙箱
  - name: Webhook
    description: Webhook 适配器
  - name: Log
    description: 日志
  - name: Health
    description: 健康检查
  - name: AgentLoop
    description: Agent 活跃循环监控
  - name: CronJob
    description: 定时任务（触发 Lua 插件）
  - name: ReplyStrategy
    description: 回复策略
  - name: Knowledge
    description: SQL 知识库
  - name: Image
    description: 图床
  - name: Sticker
    description: 表情包库
  - name: FishCalendar
    description: 摸鱼人日历
  - name: ScheduledMessage
    description: 定时消息（积木式编排）
  - name: PluginStore
    description: 插件商店

security:
  - BearerAuth: []

paths:
  # ============================================================
  # Auth
  # ============================================================
  /login:
    post:
      tags: [Auth]
      security: []
      summary: 管理员登录
      description: 管理员登录，获取 JWT token。系统初始化时默认账号 `admin / Admin123`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResp'

  /change-password:
    post:
      tags: [Auth]
      summary: 修改密码
      description: 修改当前登录用户密码（实际查 `admin` 用户）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordReq'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Adapter
  # ============================================================
  /adapter:
    get:
      tags: [Adapter]
      summary: 获取 Adapter 状态
      description: 获取 OneBot11 适配器当前运行状态（不含配置）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdapterStatus'
    put:
      tags: [Adapter]
      summary: 更新 Adapter 配置
      description: 更新 OneBot11 适配器配置（地址、Token、管理员列表、启用状态），同步到运行时。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdapterConfigReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /adapter/restart:
    post:
      tags: [Adapter]
      summary: 重启 Adapter
      description: 重启 OneBot11 适配器。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Provider
  # ============================================================
  /providers:
    get:
      tags: [Provider]
      summary: 列出所有 Provider
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProviderResp'
    post:
      tags: [Provider]
      summary: 新增 Provider
      description: 新增 Provider。若 `is_active=true`，自动停用同类型其他 Provider。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProviderReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AddProviderReq'

  /providers/{id}:
    get:
      tags: [Provider]
      summary: 获取单个 Provider
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProviderResp'
    put:
      tags: [Provider]
      summary: 更新 Provider
      description: 覆盖更新指定 Provider。
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'
    delete:
      tags: [Provider]
      summary: 删除 Provider
      description: 删除 Provider，同时从运行时 ProviderGroup 移除。
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /providers/{id}/toggle:
    put:
      tags: [Provider]
      summary: 启用/停用 Provider
      description: 启用时自动停用同类型其他 Provider。
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # MCP
  # ============================================================
  /mcp:
    get:
      tags: [MCP]
      summary: 列出所有 MCP 服务器
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MCPServerResp'
    post:
      tags: [MCP]
      summary: 新增 MCP 服务器
      description: 新增 MCP 配置，若 `is_active=true` 立即建立 SSE 连接。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMCPServerReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MCPServerResp'

  /mcp/{id}:
    get:
      tags: [MCP]
      summary: 获取单个 MCP 服务器
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MCPServerResp'
    put:
      tags: [MCP]
      summary: 更新 MCP 服务器
      description: 覆盖更新，断开旧连接，若 `is_active=true` 重新建立 SSE 连接。
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMCPServerReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MCPServerResp'
    delete:
      tags: [MCP]
      summary: 删除 MCP 服务器
      description: 断开连接并删除配置。
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /mcp/{id}/toggle:
    put:
      tags: [MCP]
      summary: 启用/停用 MCP 服务器
      description: 启用对应建立 SSE 连接，停用对应断开连接。
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Memory
  # ============================================================
  /memory/{chatAreaID}/short-term:
    get:
      tags: [Memory]
      summary: 获取短期记忆配置
      description: 获取指定 ChatArea 的短期记忆配置，不存在则自动创建（默认 `window_size=20, auto_compact=false`）。
      parameters:
        - $ref: '#/components/parameters/PathChatAreaID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShortTermMemoryResp'
    put:
      tags: [Memory]
      summary: 更新短期记忆配置
      description: 更新短期记忆配置，同步到运行时 MemoryGroup。
      parameters:
        - $ref: '#/components/parameters/PathChatAreaID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShortTermMemoryReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShortTermMemoryResp'

  /memory/{chatAreaID}/long-term:
    get:
      tags: [Memory]
      summary: 获取长期记忆配置
      description: 获取长期记忆配置，不存在则自动创建（默认 `hot_area_size=10, hot_memory_ttl=86400`）。
      parameters:
        - $ref: '#/components/parameters/PathChatAreaID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LongTermMemoryResp'
    put:
      tags: [Memory]
      summary: 更新长期记忆配置
      description: 更新长期记忆配置，同步到运行时 MemoryGroup。
      parameters:
        - $ref: '#/components/parameters/PathChatAreaID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLongTermMemoryReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LongTermMemoryResp'

  # ============================================================
  # Prompt
  # ============================================================
  /prompts:
    get:
      tags: [Prompt]
      summary: 列出所有 Prompt
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PromptResp'
    post:
      tags: [Prompt]
      summary: 新增 Prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPromptReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PromptResp'

  /prompts/{id}:
    put:
      tags: [Prompt]
      summary: 更新 Prompt
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePromptReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PromptResp'
    delete:
      tags: [Prompt]
      summary: 删除 Prompt
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /prompts/{id}/toggle:
    put:
      tags: [Prompt]
      summary: 启用/停用 Prompt
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Session
  # ============================================================
  /sessions:
    get:
      tags: [Session]
      summary: 列出所有 Session
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionResp'

  /sessions/{id}:
    get:
      tags: [Session]
      summary: 获取单个 Session
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionResp'
    delete:
      tags: [Session]
      summary: 删除 Session
      description: 删除 Session，同时清除 Redis 中的消息缓存。
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Skill
  # ============================================================
  /skills:
    get:
      tags: [Skill]
      summary: 列出所有 Skill
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SkillResp'
    post:
      tags: [Skill]
      summary: 新增 Skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSkillReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SkillResp'

  /skills/{id}:
    put:
      tags: [Skill]
      summary: 更新 Skill
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SkillResp'
    delete:
      tags: [Skill]
      summary: 删除 Skill
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Tool
  # ============================================================
  /tools:
    get:
      tags: [Tool]
      summary: 列出所有 Tool 配置
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ToolConfigResp'

  /tools/{id}/toggle:
    put:
      tags: [Tool]
      summary: 启用/停用 Tool
      description: 停用时从注册表移除；启用时内置工具已在 init 时注册，无需重复。
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Plugin
  # ============================================================
  /plugins:
    get:
      tags: [Plugin]
      summary: 列出所有插件
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PluginResp'

  /plugins/upload:
    post:
      tags: [Plugin]
      summary: 上传 ZIP 插件包
      description: 解压到 `data/pluggins/<name>/`，自动调用 `PluginEngine.Load`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PluginUploadResp'

  /plugins/{id}/toggle:
    put:
      tags: [Plugin]
      summary: 启用/停用插件
      description: 启用时调用 `PluginEngine.Load`，停用时 `Unload`。
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /plugins/{id}:
    delete:
      tags: [Plugin]
      summary: 删除插件
      description: 卸载并删除插件配置（不删除文件）。
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # ACL
  # ============================================================
  /acl:
    get:
      tags: [ACL]
      summary: 列出所有 ACL 规则
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ACLRuleResp'
    post:
      tags: [ACL]
      summary: 新增或更新 ACL 规则
      description: 同 ChatArea + Scope 已存在则覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddACLRuleReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ACLRuleResp'

  /acl/{id}:
    delete:
      tags: [ACL]
      summary: 删除 ACL 规则
      description: 删除 ACL 规则，同步到运行时 ACL 管理器。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ACL 规则 ID（自增整数，非 UUID）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  # ============================================================
  # Chat Records
  # ============================================================
  /chat-records/{chatAreaID}:
    get:
      tags: [ChatRecord]
      summary: 分页查询聊天记录
      description: 分页查询指定 ChatArea 的聊天记录，支持按 role 过滤。
      parameters:
        - $ref: '#/components/parameters/PathChatAreaID'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: 每页数量（默认 20）
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: 偏移量（默认 0）
        - name: role
          in: query
          schema:
            type: string
            enum: [user, assistant, tool]
          description: 可选过滤角色
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatRecordListResp'

  /chat-records/{chatAreaID}/token-usage:
    get:
      tags: [ChatRecord]
      summary: 获取 ChatArea Token 用量
      description: 获取指定 ChatArea 的会话 Token 用量（实际返回 Session 信息）。
      parameters:
        - $ref: '#/components/parameters/PathChatAreaID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionResp'

  # ============================================================
  # Chat Area
  # ============================================================
  /chat-areas:
    get:
      tags: [ChatArea]
      summary: 列出所有 ChatArea
      description: ChatArea 由消息驱动自动创建（私聊/群聊各一个），无手动创建接口。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatAreaResp'

  # ============================================================
  # Overview
  # ============================================================
  /overview:
    get:
      tags: [Overview]
      summary: 全局概览
      description: |
        返回系统全局概览，包括资源计数、系统状态、T2I/Sandbox 健康状态。

        - 系统状态来自 `runtime.MemStats`、`runtime.NumCPU`、`runtime.NumGoroutine`
        - T2I/Sandbox 的 `*_active` 表示客户端已加载，`*_healthy` 表示 `HealthCheck` 通过
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OverviewResp'

  # ============================================================
  # T2I
  # ============================================================
  /t2i/config:
    get:
      tags: [T2I]
      summary: 获取 T2I 配置
      description: 获取 T2I 配置与当前健康状态。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T2IConfigResp'
    put:
      tags: [T2I]
      summary: 更新 T2I 配置
      description: 运行时同步客户端（启用则创建新客户端并注入 HagoCenter，停用则置空）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateT2IConfigReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/T2IConfigResp'

  /t2i/health:
    get:
      tags: [T2I]
      summary: 检查 T2I 健康
      description: 实时检查 T2I 服务健康状态（调用客户端 `HealthCheck`）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          healthy:
                            type: boolean

  # ============================================================
  # Sandbox
  # ============================================================
  /sandbox/config:
    get:
      tags: [Sandbox]
      summary: 获取 Sandbox 配置
      description: 获取 Sandbox 配置与当前健康状态。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SandboxConfigResp'
    put:
      tags: [Sandbox]
      summary: 更新 Sandbox 配置
      description: 运行时同步客户端。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSandboxConfigReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SandboxConfigResp'

  /sandbox/health:
    get:
      tags: [Sandbox]
      summary: 检查 Sandbox 健康
      description: 实时检查 Sandbox 健康状态。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          healthy:
                            type: boolean

  # ============================================================
  # Webhook
  # ============================================================
  /webhook/config:
    get:
      tags: [Webhook]
      summary: 获取 Webhook 配置
      description: 获取 Webhook 配置与运行状态。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookConfigResp'
    put:
      tags: [Webhook]
      summary: 更新 Webhook 配置
      description: 同步到运行时 WebhookAdapter。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookConfigReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookConfigResp'

  # ============================================================
  # Logs
  # ============================================================
  /logs:
    get:
      tags: [Log]
      summary: 获取最近日志
      description: 返回最近 250 条日志（按时间顺序，最早→最新）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LogEntryResp'

  /logs/stream:
    get:
      tags: [Log]
      summary: SSE 实时日志流
      description: |
        通过 SSE 推送实时日志。

        - 连接建立后先发送最近 250 条历史日志（每个一条 `log` 事件）
        - 然后订阅 Hub，实时推送新日志
        - 每 15 秒发送一次 keepalive 心跳
        - 客户端断开或服务停止时退出

        事件格式:
        ```
        event: log
        data: {"time":"2026-07-20T12:00:00Z","level":"INFO","message":"...","attrs":{}}
        ```
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 事件流

  /health:
    get:
      tags: [Health]
      summary: 健康检查
      description: |
        根路径健康检查（实际 URL 为 http://localhost:8090/health，不在 /api/v1 前缀下），
        无需认证。响应 `{"status":"ok"}`。
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /adapter/config:
    get:
      tags: [Adapter]
      summary: 获取 Adapter 配置
      description: 读取 OneBot11 适配器配置（不含运行状态）。数据库无配置时自动写入默认值。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdapterConfig'

  /providers/presets:
    get:
      tags: [Provider]
      summary: 列出 Provider 预设
      description: 内置 LLM 厂商预设及其协议参数（供前端表单快速填充）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProviderPresetResp'

  /providers/test:
    post:
      tags: [Provider]
      summary: 测试 Provider 连通性
      description: 用请求体配置（不落库）测试 LLM 端点连通性。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProviderReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TestProviderResp'

  /mcp/{id}/check:
    get:
      tags: [MCP]
      summary: 检查 MCP 服务器连通性
      description: 按配置建立一次 SSE 连接后立即断开，返回健康状态。
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MCPCheckResp'

  /tools/{id}/admin-only:
    put:
      tags: [Tool]
      summary: 设置工具仅管理员
      description: 更新工具「仅管理员」标志（防提示词注入诱导敏感操作）。
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateToolAdminOnlyReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /plugins/reload:
    post:
      tags: [Plugin]
      summary: 重载全部插件
      description: 依次卸载并重新加载 data/pluggins/ 下所有插件。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /plugins/{id}/reload:
    post:
      tags: [Plugin]
      summary: 重载单个插件
      parameters:
        - $ref: '#/components/parameters/PathPluginID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /plugins/{id}/config:
    get:
      tags: [Plugin]
      summary: 获取插件动态配置
      description: 返回插件 config.yaml 的 schema 与当前 values（供 Web 面板动态渲染表单）。
      parameters:
        - $ref: '#/components/parameters/PathPluginID'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PluginConfigResp'
    put:
      tags: [Plugin]
      summary: 保存插件动态配置
      description: 保存配置到 pluggin.yaml 并热重载插件。
      parameters:
        - $ref: '#/components/parameters/PathPluginID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 任意键值对（按 config.yaml schema）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /plugins/{id}/readme:
    get:
      tags: [Plugin]
      summary: 获取插件 README
      description: 返回插件 README.md 原文。
      parameters:
        - $ref: '#/components/parameters/PathPluginID'
      responses:
        '200':
          description: README 原文
          content:
            text/markdown:
              schema:
                type: string

  /plugins/{id}/avatar:
    get:
      tags: [Plugin]
      summary: 获取插件头像
      description: 返回插件 avatar.png 图片。
      parameters:
        - $ref: '#/components/parameters/PathPluginID'
      responses:
        '200':
          description: 头像图片
          content:
            image/png:
              schema:
                type: string
                format: binary

  /plugin-store:
    get:
      tags: [PluginStore]
      summary: 商店插件列表
      description: 从插件仓库镜像源实时拉取并合并分片索引，按名称排序。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StorePluginEntry'

  /plugin-store/readme:
    get:
      tags: [PluginStore]
      summary: 获取商店插件 README
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 插件目录路径（如 demo/hello）
      responses:
        '200':
          description: README 原文
          content:
            text/markdown:
              schema:
                type: string

  /plugin-store/avatar:
    get:
      tags: [PluginStore]
      summary: 获取商店插件头像
      description: "实时拉取（Cache-Control: no-store），仓库更新后刷新可见。"
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 插件目录路径（如 demo/hello）
      responses:
        '200':
          description: 头像图片
          content:
            image/png:
              schema:
                type: string
                format: binary

  /plugin-store/install:
    post:
      tags: [PluginStore]
      summary: 安装商店插件
      description: 下载 dist/<name>.zip 并解压安装到 data/pluggins/<name>/。
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: 插件目录路径（如 demo/hello）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PluginUploadResp'

  /plugin-store/config:
    get:
      tags: [PluginStore]
      summary: 获取商店配置
      description: 返回仓库配置与可用镜像列表。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreConfigResp'
    put:
      tags: [PluginStore]
      summary: 更新商店仓库配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreConfigUpdateReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /plugin-store/mirror:
    post:
      tags: [PluginStore]
      summary: 添加自定义镜像源
      description: 镜像地址必须包含 {path} 占位符。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'
    delete:
      tags: [PluginStore]
      summary: 删除自定义镜像源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /plugin-store/mirror/test:
    post:
      tags: [PluginStore]
      summary: 测试镜像源连通性
      description: 返回测试延迟。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MirrorTestResp'

  /plugin-store/mirror/select:
    post:
      tags: [PluginStore]
      summary: 选择生效镜像源
      description: 手动指定镜像源（空字符串 = 恢复默认自动按序尝试）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResponse'

  /overview/daily-token-usage:
    get:
      tags: [Overview]
      summary: 每日 Token 用量
      description: 返回连续日期序列（缺失日期补 0），供仪表盘折线图使用。
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            maximum: 30
          description: 最近 N 天（默认 7，上限 30）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DailyTokenUsageResp'

  /agent/loops:
    get:
      tags: [AgentLoop]
      summary: 活跃 Agent 循环
      description: 返回当前所有活跃的 Agent ReAct 循环（内存态监控，原后台任务页改造）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentLoopResp'

  /cronjobs:
    get:
      tags: [CronJob]
      summary: 列出所有 CronJob
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CronJobResp'
    post:
      tags: [CronJob]
      summary: 新增 CronJob
      description: 6 字段秒级 cron，触发时调用绑定插件的 on_cronjob 回调（不经过 Agent）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCronJobReq'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CronJobResp'

  /cronjobs/{id}:
